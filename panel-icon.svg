<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#0f1117"/>

  <!-- Server rack body -->
  <rect x="10" y="14" width="44" height="10" rx="3" fill="#1e2030" stroke="#4f8ef7" stroke-width="1.5"/>
  <rect x="10" y="27" width="44" height="10" rx="3" fill="#1e2030" stroke="#4f8ef7" stroke-width="1.5"/>
  <rect x="10" y="40" width="44" height="10" rx="3" fill="#1e2030" stroke="#4f8ef7" stroke-width="1.5"/>

  <!-- Status LEDs row 1 -->
  <circle cx="18" cy="19" r="2.5" fill="#a6e3a1"/>
  <circle cx="25" cy="19" r="2.5" fill="#a6e3a1"/>
  <circle cx="32" cy="19" r="2.5" fill="#f9e2af"/>

  <!-- Status LEDs row 2 -->
  <circle cx="18" cy="32" r="2.5" fill="#a6e3a1"/>
  <circle cx="25" cy="32" r="2.5" fill="#f38ba8"/>
  <circle cx="32" cy="32" r="2.5" fill="#a6e3a1"/>

  <!-- Status LEDs row 3 -->
  <circle cx="18" cy="45" r="2.5" fill="#a6e3a1"/>
  <circle cx="25" cy="45" r="2.5" fill="#a6e3a1"/>
  <circle cx="32" cy="45" r="2.5" fill="#a6e3a1"/>

  <!-- Drive slots -->
  <rect x="38" y="17" width="12" height="4" rx="1" fill="#2d3158"/>
  <rect x="38" y="30" width="12" height="4" rx="1" fill="#2d3158"/>
  <rect x="38" y="43" width="12" height="4" rx="1" fill="#2d3158"/>

  <!-- Accent line bottom -->
  <rect x="10" y="54" width="44" height="2" rx="1" fill="#4f8ef7" opacity="0.6"/>
</svg>
